<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Garen animation integration checks</title>

<script type="importmap">{"imports":{"three":"/lib/three.module.js","three/addons/":"/lib/three-addons/"}}</script>
<style>body{margin:0;background:#17242d;color:#e6edf3;font:14px system-ui;display:grid;grid-template-columns:1fr 1fr}canvas{width:100%;height:100vh;display:block}section{padding:24px;overflow:auto;height:100vh;box-sizing:border-box}pre{white-space:pre-wrap;font-size:12px}h1{font-size:20px}#status{color:#cdb77a}body[data-status=PASS] #status{color:#88e6a5}body[data-status=FAIL] #status{color:#ff9494}</style>
<canvas id="scene"></canvas><section><h1>Garen animation integration checks</h1><p id="status">Loading extracted asset…</p><pre id="result">Running</pre></section>
<script type="module">
import * as THREE from 'three';
import { loadGarenAsset, GarenAnimation, attachGarenModel } from '/js/garenModel.js';

const checks = [], errors = [];
const report = { status:'RUNNING', checks, errors };
const assert = (name, passed, detail = null) => { checks.push({name,passed:!!passed,detail}); };
const canvas = document.getElementById('scene');
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x17242d);
scene.add(new THREE.HemisphereLight(0xe5f0ff,0x687a67,2));
const light = new THREE.DirectionalLight(0xffffff,2); light.position.set(90,120,100); scene.add(light);
const renderer = new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(1); renderer.setSize(innerWidth/2,innerHeight,false);
renderer.debug.onShaderError = (gl,program,vs,fs) => errors.push({shader:gl.getProgramInfoLog(program),vertex:gl.getShaderInfoLog(vs),fragment:gl.getShaderInfoLog(fs)});
const camera = new THREE.PerspectiveCamera(38,(innerWidth/2)/innerHeight,.1,1000);
camera.position.set(105,78,150); camera.lookAt(0,28,0);
window.addEventListener('error', e => errors.push({error:e.message}));
const meshOf = rig => { let mesh; rig.root.traverse(o=>{if(o.isSkinnedMesh&&!o.userData.isOutline) mesh=o;}); return mesh; };
function pose(rig) {
  rig.root.updateMatrixWorld(true); const mesh=meshOf(rig); mesh.skeleton.update();
  const result=[]; const v=new THREE.Vector3();
  for(let i=0;i<mesh.geometry.attributes.position.count;i+=17){mesh.getVertexPosition(i,v).applyMatrix4(mesh.matrixWorld);result.push(v.x,v.y,v.z);}
  return result;
}
const difference=(a,b)=>Math.max(...a.map((v,i)=>Math.abs(v-b[i])));
function motion(name,rig,moving,dt,speed=310) {
  const before=pose(rig); rig.update(moving,dt,speed); const after=pose(rig), delta=difference(before,after);
  assert(name,after.every(Number.isFinite)&&delta>0.001,{maxWorldVertexDelta:delta});
}
let first,second;
try {
  const pending=loadGarenAsset(); assert('single cached asset request',pending===loadGarenAsset());
  const asset=await pending;
  first=new GarenAnimation(asset); second=new GarenAnimation(asset);
  scene.add(first.root,second.root); first.root.position.x=-38; second.root.position.x=38;
  const aMesh=meshOf(first),bMesh=meshOf(second);
  assert('independent skeleton and bones',aMesh.skeleton!==bMesh.skeleton&&aMesh.skeleton.bones[0]!==bMesh.skeleton.bones[0]);
  assert('independent materials with shared texture',first.bodyMaterial!==second.bodyMaterial&&first.bodyMaterial.map===second.bodyMaterial.map);
  assert('decoded texture is present',first.bodyMaterial.map.image.width===512&&first.bodyMaterial.map.image.height===512);
  assert('toon material and skinning-aware outline',first.bodyMaterial.isMeshToonMaterial&&aMesh.children.some(o=>o.isSkinnedMesh&&o.userData.isOutline&&o.skeleton===aMesh.skeleton));
  first.update(false,.15,310); second.update(false,.15,310);
  assert('idle selection',first.current===0);
  motion('idle deforms actual skinned vertices',first,false,.2);
  first.update(true,.15,310); assert('movement selects run',first.current===1);
  motion('run deforms actual skinned vertices',first,true,.2);
  first.update(true,.05,620); assert('movement speed scales run',Math.abs(first.actions[1].getEffectiveTimeScale()-2)<1e-6);
  first.attack(.75); const slowDuration=first.attackRemaining;
  first.update(false,.12,310); assert('first attack selects attack 01',first.current===2);
  motion('attack 01 deforms actual skinned vertices',first,false,.16);
  const frozenPose=pose(first),frozenMixer=first.mixer.time,frozenRemaining=first.attackRemaining;
  first.update(false,0,310);
  assert('hit-stop preserves pose, time and recovery',difference(frozenPose,pose(first))<1e-8&&first.mixer.time===frozenMixer&&first.attackRemaining===frozenRemaining);
  first.attack(2); const fastDuration=first.attackRemaining;
  assert('consecutive attack alternates to attack 02',first.current===3);
  assert('attack speed compresses playback before next attack',fastDuration<slowDuration&&fastDuration<.5&&Math.abs(first.actions[3].getClip().duration/first.actions[3].getEffectiveTimeScale()-fastDuration)<1e-6,{slowDuration,fastDuration});
  first.update(false,.12,310); motion('attack 02 deforms actual skinned vertices',first,false,.12);
  for(let i=0;i<12;i++) first.update(false,.05,310);
  assert('finished attack returns to idle without repeating',first.current===0&&first.attackRemaining===0);
  first.attack(.75); first.update(true,.15,310);
  assert('movement cancels attack recovery into run',first.current===1&&first.attackRemaining===0);
  const peerPose=pose(second),peerTime=second.mixer.time;
  first.update(true,.2,310); first.bodyMaterial.opacity=.35;
  assert('other player pose and material remain independent',difference(peerPose,pose(second))<1e-8&&second.mixer.time===peerTime&&second.bodyMaterial.opacity===1);
  first.bodyMaterial.opacity=1;
  first.update(false,.1,310,false);
  const deadAttackIndex=first.attackIndex; first.attack(1);
  assert('dead player stops actions and ignores attacks',first.dead&&first.current===-1&&first.attackRemaining===0&&first.attackIndex===deadAttackIndex);
  first.update(false,.15,310,true);
  assert('respawn resumes idle',!first.dead&&first.current===0);
  motion('respawn idle animates the skeleton',first,false,.2);
  renderer.render(scene,camera);
  const outline=aMesh.children.find(o=>o.userData.isOutline);
  assert('skinned outline follows body skeleton vertices',difference(pose(first),(()=>{outline.updateMatrixWorld(true);outline.skeleton.update();const points=[],v=new THREE.Vector3();for(let i=0;i<outline.geometry.attributes.position.count;i+=17){outline.getVertexPosition(i,v).applyMatrix4(outline.matrixWorld);points.push(v.x,v.y,v.z);}return points;})())<1e-5);
  assert('WebGL shader compilation completed',errors.length===0&&renderer.info.programs.length>=2,{programs:renderer.info.programs.length});
  const gl=renderer.getContext(),pixel=new Uint8Array(4); gl.readPixels(Math.floor(canvas.width/2),Math.floor(canvas.height/2),1,1,gl.RGBA,gl.UNSIGNED_BYTE,pixel);
  assert('WebGL renderer issues mesh draw calls',renderer.info.render.calls>=4&&gl.getError()===gl.NO_ERROR,{drawCalls:renderer.info.render.calls,triangles:renderer.info.render.triangles});
  let materialDisposals=0,geometryDisposals=0,textureDisposals=0;
  first.materials.forEach(m=>m.addEventListener('dispose',()=>materialDisposals++));
  aMesh.geometry.addEventListener('dispose',()=>geometryDisposals++);
  first.bodyMaterial.map.addEventListener('dispose',()=>textureDisposals++);
  first.dispose(); first.dispose();
  assert('dispose removes root and releases instance materials once',first.disposed&&first.root.parent===null&&materialDisposals===first.materials.length);
  assert('dispose preserves shared geometry and texture',geometryDisposals===0&&textureDisposals===0);
  second.update(true,.15,310); motion('remaining player animates after peer disposal',second,true,.2);
  renderer.render(scene,camera);
  const abandoned=new THREE.Group(); abandoned.userData.disposed=true;
  assert('async attachment ignores disposed owner',await attachGarenModel(abandoned)===null&&abandoned.children.length===0);
  const owner=new THREE.Group(),ring=new THREE.Group(),placeholder=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshBasicMaterial());
  owner.userData.groundRing=ring; owner.add(ring,placeholder); owner.userData.leftArm=placeholder;
  const attached=await attachGarenModel(owner);
  assert('attachment keeps team ring and removes procedural visual',!!attached&&owner.children.includes(ring)&&!owner.children.includes(placeholder)&&!owner.userData.leftArm&&owner.userData.garen===attached);
  attached?.dispose();
  report.status=checks.every(c=>c.passed)&&errors.length===0?'PASS':'FAIL';
} catch(error) {
  errors.push({message:error.message,stack:error.stack}); report.status='FAIL';
}
document.body.dataset.status=report.status;
document.getElementById('status').textContent=`${report.status} — ${checks.filter(c=>c.passed).length}/${checks.length} checks`;
document.getElementById('result').textContent=JSON.stringify(report,null,2);
console.info('GAREN_ANIMATION_TEST',JSON.stringify(report));
if(second&&!second.disposed){second.root.position.x=0;let last=performance.now();function frame(now){requestAnimationFrame(frame);second.update(true,Math.min((now-last)/1000,.05),310);last=now;renderer.render(scene,camera);}requestAnimationFrame(frame);}
</script>
</html>
