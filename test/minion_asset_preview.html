<!doctype html><html><meta charset="utf-8"><title>Original minion asset preview</title><link rel="icon" href="data:,">
<script type="importmap">{"imports":{"three":"/lib/three.module.js","three/addons/":"/lib/three-addons/"}}</script>
<style>body{margin:0;background:#101c27;color:#ecf3fa;font:14px system-ui}header{padding:18px 28px}h1{font-size:22px;margin:0}p{margin:6px 0;color:#9fb3c4}#preview{width:100vw;height:650px;display:block}.labels{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;margin:0 90px}pre{padding:0 24px;white-space:pre-wrap;font-size:11px;max-height:150px;overflow:auto}</style>
<header><h1>Original Summoner's Rift minions · blue / red</h1><p>Base models, original texture atlases, and idle/run/attack/death clips from local Map11.wad.client · Click model animation buttons to compare.</p><button id="idle">Idle</button> <button id="run">Run</button> <button id="attack">Attack</button> <button id="death">Death</button> <span id="status">Loading…</span></header>
<div class="labels"><span>Melee</span><span>Ranged</span><span>Siege</span><span>Super</span></div><canvas id="preview"></canvas><pre id="report"></pre>
<script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {createChampionMaterial} from '/js/nprMaterial.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x101c27);scene.add(new THREE.HemisphereLight(0xd9edff,0x64765b,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(100,300,200);scene.add(light);
const canvas=document.querySelector('canvas'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setSize(innerWidth,650,false);const camera=new THREE.OrthographicCamera(-230*innerWidth/1320,230*innerWidth/1320,150,-150,.1,2000);camera.position.set(0,240,450);camera.lookAt(0,24,0);
const grid=new THREE.GridHelper(500,25,0x516a78,0x223643);scene.add(grid);const models=[],errors=[];window.addEventListener('error',e=>errors.push(e.message));window.addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));
renderer.debug.onShaderError=(gl,p)=>errors.push(gl.getProgramInfoLog(p));const manifest=await fetch('/assets/units/minions/manifest.json').then(r=>r.json()),loader=new GLTFLoader(),checks=[];
const pose=(record)=>{record.root.updateMatrixWorld(true);const v=new THREE.Vector3(),a=[];for(const m of record.meshes){m.skeleton.update();for(let i=0;i<m.geometry.attributes.position.count;i+=19){m.getVertexPosition(i,v).applyMatrix4(m.matrixWorld);a.push(v.x,v.y,v.z);}}return a;};
for(let index=0;index<manifest.models.length;index++){
 const source=manifest.models[index],asset=await loader.loadAsync('/assets/units/minions/'+source.file),root=asset.scene;root.scale.setScalar(.30);root.position.set((index%4-1.5)*105,0,index<4?-65:65);scene.add(root);
 const meshes=[];root.traverse(m=>{if(m.isSkinnedMesh){meshes.push(m);m.material=createChampionMaterial(0xffffff,0,{map:m.material.map,rimStrength:.1});m.frustumCulled=false;}});
 const mixer=new THREE.AnimationMixer(root),actions=asset.animations.map(c=>mixer.clipAction(c)),record={source,root,meshes,mixer,actions};models.push(record);
 const checked=[];for(let i=0;i<actions.length;i++){mixer.stopAllAction();actions[i].reset().play();mixer.update(.12);const a=pose(record);mixer.update(.17);const b=pose(record);const delta=Math.max(...a.map((x,j)=>Math.abs(x-b[j])));checked.push({clip:asset.animations[i].name,duration:asset.animations[i].duration,delta,finite:b.every(Number.isFinite),pass:delta>.00001&&b.every(Number.isFinite)});}
 mixer.stopAllAction();const idle=asset.animations.findIndex(c=>source.roles.idle.includes(c.name));actions[idle].reset().play();mixer.update(.1);
 const box=new THREE.Box3();const v=new THREE.Vector3();root.updateMatrixWorld(true);for(const m of meshes){m.skeleton.update();for(let n=0;n<m.geometry.attributes.position.count;n++){m.getVertexPosition(n,v).applyMatrix4(m.matrixWorld);box.expandByPoint(v);}}
 checks.push({id:source.id,textures:meshes.every(m=>m.material.map?.image?.width>0),clips:checked,idleBounds:{min:box.min.toArray(),max:box.max.toArray()},idleFeetY:box.min.y});
}
const select=role=>{for(const m of models){m.mixer.stopAllAction();const index=m.actions.findIndex(a=>m.source.roles[role].includes(a.getClip().name));m.actions[index].reset().play();}};for(const role of ['idle','run','attack','death'])document.getElementById(role).onclick=()=>select(role);
renderer.compile(scene,camera);renderer.render(scene,camera);const report={status:checks.every(c=>c.textures&&c.clips.every(a=>a.pass))&&!errors.length?'PASS':'FAIL',models:checks,errors};document.body.dataset.ready='true';document.body.dataset.status=report.status;document.getElementById('status').textContent=report.status+' · 8 models / 55 original clips';document.getElementById('report').textContent=JSON.stringify(report,null,2);console.log('MINION_ASSET_PREVIEW '+JSON.stringify(report));let last=performance.now();function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.05);last=now;for(const m of models)m.mixer.update(dt);renderer.render(scene,camera);}requestAnimationFrame(frame);
</script></html>
